name: Installation tests
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  macos-15-installation-test:
    runs-on: macos-15
    if: "${{ !startsWith(github.event.head_commit.message, 'docs: ') && !startsWith(github.event.head_commit.message, 'chore: ') && !startsWith(github.event.head_commit.message, 'style: ') }}"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v6
      with:
        version: latest
    - name: Install on macOS
      shell: zsh {0}
      run: |
        echo '::group:: 🏗 Show installation log'
        # Source the main plugin file to make functions available
        source ./zsh_dist/zsh-ai.plugin.zsh
        # Run the installation function to set up the venv and dependencies
        zsh_ai_install
        echo "Plugin installation function 'zsh_ai_install' executed."
        echo "Virtual environment path should be: ~/.zsh-ai"

        # Verify python venv was created
        if [ ! -d ~/.zsh-ai ]; then
          echo "Virtual environment ~/.zsh-ai not found!"
          exit 1
        else
          echo "Virtual environment ~/.zsh-ai found."
        fi

        # Verify pip dependencies were installed (check for a key package like 'openai' or 'google-generativeai')
        # Assuming 'openai' is a core dependency. Adjust if needed.
        echo "Checking for 'openai' package in venv..."
        if ! ~/.zsh-ai/bin/pip list | grep -i openai; then
             echo "Key dependency 'openai' not found in venv!"
             echo "Installed packages:"
             ~/.zsh-ai/bin/pip list
             exit 1
        else
          echo "'openai' package found."
        fi
        echo '::endgroup::'

        echo '::group:: 🐞 Show bug report'
        # Ensure the bug report function is available after sourcing and installation
        zsh_ai_bug_report
        echo '::endgroup::'

  linux-installation-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
        - archlinux
        - ubuntu
        - fedora
    if: "${{ !startsWith(github.event.head_commit.message, 'docs: ') && !startsWith(github.event.head_commit.message, 'chore: ') && !startsWith(github.event.head_commit.message, 'style: ') }}"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install on ${{ matrix.os }}
      uses: docker/build-push-action@v6
      with:
          context: .
          file: tests/${{ matrix.os }}/Dockerfile
          push: false
          build-args: SOURCE=${{ github.repository }}@${{ github.sha }}

  results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Installation test results
    needs:
    - macos-15-installation-test
    - linux-installation-tests
    steps:
    - run: |
        linux_result="${{ needs.linux-installation-tests.result }}"
        macos_result="${{ needs.macos-15-installation-test.result }}"
        if [[ $linux_result == "success" || $linux_result == "skipped" ]]; then
          if [[ $macos_result == "success" || $macos_result == "skipped" ]]; then
            exit 0
          fi
        fi

        exit 1
